name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy latest main to EC2 and restart app containers
        shell: powershell
        env:
          EC2_HOST: 13.125.76.77
          EC2_SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
        run: |
          $ErrorActionPreference = "Stop"
          $keyPath = Join-Path $env:RUNNER_TEMP "realtimechat-ec2-deploy-key"

          try {
            if ([string]::IsNullOrWhiteSpace($env:EC2_SSH_KEY_B64)) {
              throw "EC2_SSH_KEY_B64 secret is empty."
            }

            $keyBytes = [Convert]::FromBase64String(($env:EC2_SSH_KEY_B64 -replace '\\s', ''))
            [System.IO.File]::WriteAllBytes($keyPath, $keyBytes)
            $runnerIdentity = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
            & icacls.exe $keyPath /inheritance:r | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Could not restrict private-key permissions." }
            & icacls.exe $keyPath /grant:r "$($runnerIdentity):(R)" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Could not grant the runner read access to the private key." }

            $remoteScript = @'
          set -e
          cd /home/ubuntu/RealTimeChat

          # Preserve server-side edits before switching to the repository revision.
          # This prevents Git from aborting when docker-compose.yml was tuned on EC2.
          git fetch origin main
          if ! git diff --quiet || ! git diff --cached --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git stash push --include-untracked -m "pre-deploy-local-changes-$(date +%Y%m%d%H%M%S)"
          fi

          # Deploy the exact main revision after safely stashing local changes.
          git checkout -B main origin/main
          echo "Deploying commit: $(git rev-parse --short HEAD)"
          git status --short --branch
          echo "Recent preserved local changes:"
          git stash list -n 3

          # Explicitly start only production services. Profiled monitoring services
          # are not part of this deployment and will not be started by this command.
          docker compose config --services
          docker compose up -d --build nginx app-1 app-2
          docker compose ps
          '@
            $remoteScript = $remoteScript.TrimStart([char[]]@(0xFEFF, 0x0D, 0x0A))
            $remoteScript = $remoteScript -replace "`r`n", "`n" -replace "`r", ""
            $scriptBase64 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($remoteScript))
            $remoteCommand = "printf '%s' '$scriptBase64' | base64 -d | bash -se"

            & ssh -i $keyPath -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new "ubuntu@$env:EC2_HOST" $remoteCommand
            if ($LASTEXITCODE -ne 0) {
              throw "EC2 deployment failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Remove-Item $keyPath -Force -ErrorAction SilentlyContinue
          }
