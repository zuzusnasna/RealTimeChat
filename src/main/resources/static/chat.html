<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealTimeChat - Chat Rooms</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 820px; margin: 32px auto; padding: 0 20px; color: #222; }
        .row { display: flex; gap: 8px; margin: 12px 0; }
        input, select { padding: 10px; box-sizing: border-box; }
        #roomName { flex: 1; }
        #roomSelect { width: 100%; }
        #messages { height: 380px; overflow-y: auto; border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin: 12px 0; }
        .message { margin-bottom: 10px; overflow-wrap: anywhere; }
        .meta { color: #777; font-size: 12px; margin-left: 6px; }
        .system { color: #777; }
        #sender { width: 140px; }
        #content { flex: 1; min-width: 0; }
        button { padding: 10px 14px; cursor: pointer; }
        button:disabled { cursor: not-allowed; opacity: .5; }
    </style>
</head>
<body>
<h1>RealTimeChat</h1>
<p id="status" class="system">WebSocket 연결 중...</p>

<h2>채팅방</h2>
<div class="row">
    <input id="roomName" type="text" maxlength="100" placeholder="새 채팅방 이름">
    <button id="createRoom" type="button">방 만들기</button>
</div>
<select id="roomSelect" aria-label="채팅방 선택"></select>

<div id="messages" aria-live="polite"></div>

<div class="row">
    <input id="sender" type="text" maxlength="50" placeholder="이름">
    <input id="content" type="text" maxlength="1000" placeholder="메시지 입력">
    <button id="send" type="button" disabled>전송</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.1.1/bundles/stomp.umd.min.js"></script>
<script>
    const status = document.getElementById('status');
    const messages = document.getElementById('messages');
    const senderInput = document.getElementById('sender');
    const contentInput = document.getElementById('content');
    const sendButton = document.getElementById('send');
    const roomSelect = document.getElementById('roomSelect');
    const roomNameInput = document.getElementById('roomName');
    const createRoomButton = document.getElementById('createRoom');

    let activeRoomId = null;
    let roomSubscription = null;

    const client = new StompJs.Client({
        brokerURL: 'ws://localhost:8080/ws',
        reconnectDelay: 3000,
        onConnect: async () => {
            status.textContent = 'WebSocket 연결됨';
            status.style.color = 'green';
            await loadRooms();
        },
        onWebSocketError: () => {
            status.textContent = 'WebSocket 연결 실패';
            status.style.color = 'red';
        },
        onStompError: (frame) => {
            console.error('STOMP error:', frame);
            status.textContent = '메시지 처리 오류가 발생했습니다.';
        }
    });

    async function loadRooms(selectRoomId = null) {
        try {
            const response = await fetch('/api/rooms');
            if (!response.ok) throw new Error('채팅방 목록을 불러오지 못했습니다.');
            const rooms = await response.json();

            roomSelect.replaceChildren();
            rooms.forEach((room) => {
                const option = document.createElement('option');
                option.value = room.id;
                option.textContent = room.name;
                roomSelect.appendChild(option);
            });

            if (rooms.length === 0) {
                activeRoomId = null;
                roomSubscription?.unsubscribe();
                roomSubscription = null;
                messages.replaceChildren();
                messages.textContent = '채팅방을 만들어 대화를 시작하세요.';
                sendButton.disabled = true;
                return;
            }

            const targetId = selectRoomId ?? (rooms.some(r => String(r.id) === String(activeRoomId)) ? activeRoomId : rooms[0].id);
            roomSelect.value = String(targetId);
            await selectRoom(targetId);
        } catch (error) {
            status.textContent = error.message;
            status.style.color = 'red';
        }
    }

    async function selectRoom(roomId) {
        if (!roomId) return;
        activeRoomId = Number(roomId);
        roomSubscription?.unsubscribe();
        roomSubscription = null;
        messages.replaceChildren();
        sendButton.disabled = !client.connected;

        try {
            const response = await fetch('/api/rooms/' + activeRoomId + '/messages');
            if (!response.ok) throw new Error('메시지 내역을 불러오지 못했습니다.');
            const history = await response.json();
            history.forEach(appendMessage);
        } catch (error) {
            appendSystemMessage(error.message);
        }

        if (client.connected) {
            roomSubscription = client.subscribe('/topic/rooms/' + activeRoomId, (frame) => {
                appendMessage(JSON.parse(frame.body));
            });
        }
    }

    function appendMessage(data) {
        const item = document.createElement('div');
        item.className = 'message';
        const text = document.createElement('span');
        text.textContent = data.sender + ': ' + data.content;
        item.appendChild(text);

        if (data.createdAt) {
            const time = document.createElement('span');
            time.className = 'meta';
            time.textContent = new Date(data.createdAt).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
            item.appendChild(time);
        }

        messages.appendChild(item);
        messages.scrollTop = messages.scrollHeight;
    }

    function appendSystemMessage(text) {
        const item = document.createElement('div');
        item.className = 'system';
        item.textContent = text;
        messages.appendChild(item);
    }

    async function createRoom() {
        const name = roomNameInput.value.trim();
        if (!name) {
            roomNameInput.focus();
            return;
        }

        createRoomButton.disabled = true;
        try {
            const response = await fetch('/api/rooms', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            });
            if (!response.ok) {
                const body = await response.json().catch(() => ({}));
                throw new Error(body.detail || body.message || '채팅방 생성에 실패했습니다.');
            }
            const room = await response.json();
            roomNameInput.value = '';
            await loadRooms(room.id);
        } catch (error) {
            status.textContent = error.message;
            status.style.color = 'red';
        } finally {
            createRoomButton.disabled = false;
        }
    }

    function sendMessage() {
        const sender = senderInput.value.trim();
        const content = contentInput.value.trim();
        if (!sender || !content || !activeRoomId || !client.connected) return;

        client.publish({
            destination: '/app/chat/' + activeRoomId,
            body: JSON.stringify({ sender, content })
        });
        contentInput.value = '';
        contentInput.focus();
    }

    roomSelect.addEventListener('change', () => selectRoom(roomSelect.value));
    createRoomButton.addEventListener('click', createRoom);
    roomNameInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') createRoom();
    });
    sendButton.addEventListener('click', sendMessage);
    contentInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') sendMessage();
    });

    fetch('/api/auth/me').then(response => { if (!response.ok) window.location.href = '/login.html'; else client.activate(); }).catch(() => { window.location.href = '/login.html'; });
</script>
</body>
</html>
