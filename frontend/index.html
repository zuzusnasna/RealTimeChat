<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171b26" />
    <title>RealTimeChat</title>
    <style>
      @media (max-width: 720px) {
        .composer input {
          font-size: 16px !important;
        }
      }

      /* Room owner actions: keep delete reachable without making the list noisy. */
      .room-item .room-delete {
        width: 34px;
        flex-basis: 34px;
        min-height: 36px;
        margin: 2px 0;
        border-left: 1px solid transparent;
        color: #aeb6c5;
        font-size: 18px;
        font-weight: 500;
        opacity: .9;
      }
      .room-item .room-delete:hover,
      .room-item .room-delete:focus-visible {
        border-left-color: #454b58;
        background: #2b303c;
        color: #ff8f9b;
        opacity: 1;
      }
      .room-item:hover .room-delete {
        color: #c5ccda;
      }
      @media (max-width: 720px) {
        .room-item .room-delete {
          width: 40px;
          flex-basis: 40px;
          min-height: 40px;
          color: #b9c1cf;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
