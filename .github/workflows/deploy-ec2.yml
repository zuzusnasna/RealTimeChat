name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: \${{ vars.EC2_DEPLOY_ENABLED == 'true' }}
    runs-on: self-hosted
    steps:
      - name: Deploy latest main on EC2
        shell: powershell
        env:
          EC2_HOST: 13.125.76.77
          EC2_SSH_KEY: \${{ secrets.EC2_SSH_KEY }}
          EC2_FINGERPRINT: \${{ secrets.EC2_FINGERPRINT }}
        run: |
          $ErrorActionPreference = "Stop"
          $keyPath = Join-Path $env:RUNNER_TEMP "realtimechat-ec2-deploy-key"
          $knownHostsPath = Join-Path $env:RUNNER_TEMP "realtimechat-ec2-known-hosts"
          $scanPath = Join-Path $env:RUNNER_TEMP "realtimechat-ec2-keyscan"

          try {
            if ([string]::IsNullOrWhiteSpace($env:EC2_SSH_KEY)) { throw "EC2_SSH_KEY secret is empty." }
            if ([string]::IsNullOrWhiteSpace($env:EC2_FINGERPRINT)) { throw "EC2_FINGERPRINT secret is empty." }

            [System.IO.File]::WriteAllText($keyPath, $env:EC2_SSH_KEY.Trim() + [Environment]::NewLine, [System.Text.Encoding]::ASCII)

            $tcp = Test-NetConnection -ComputerName $env:EC2_HOST -Port 22 -WarningAction SilentlyContinue
            if (-not $tcp.TcpTestSucceeded) { throw "TCP port 22 is unreachable at $($env:EC2_HOST)." }

            $gitKeyscan = Join-Path $env:ProgramFiles 'Git\usr\bin\ssh-keyscan.exe'
            if (Test-Path $gitKeyscan) { $keyscanCommand = $gitKeyscan }
            else { $keyscanCommand = (Get-Command ssh-keyscan -ErrorAction Stop).Source }

            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $keyscanCommand
            $psi.Arguments = '-T 10 -t ed25519,rsa ' + $env:EC2_HOST
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $process = New-Object System.Diagnostics.Process
            $process.StartInfo = $psi
            [void]$process.Start()
            $scanOutput = $process.StandardOutput.ReadToEnd()
            $scanError = $process.StandardError.ReadToEnd()
            $process.WaitForExit()
            if ($process.ExitCode -ne 0 -or [string]::IsNullOrWhiteSpace($scanOutput)) {
              throw "ssh-keyscan failed. Exit code: $($process.ExitCode). Details: $scanError"
            }

            [System.IO.File]::WriteAllText($scanPath, $scanOutput, [System.Text.Encoding]::ASCII)
            Copy-Item $scanPath $knownHostsPath -Force
            $fingerprintOutput = & ssh-keygen -lf $knownHostsPath -E sha256
            $fingerprints = [regex]::Matches(($fingerprintOutput -join [Environment]::NewLine), 'SHA256:[A-Za-z0-9+/]+={0,2}') | ForEach-Object { $_.Value }

            # EC2_FINGERPRINT may contain either the fingerprint alone or the complete ssh-keygen output line.
            $expectedFingerprint = $null
            foreach ($part in ($env:EC2_FINGERPRINT -split '\s+')) {
              if ($part.StartsWith('SHA256:')) { $expectedFingerprint = $part.Trim(); break }
            }
            if ([string]::IsNullOrWhiteSpace($expectedFingerprint)) {
              throw "EC2_FINGERPRINT must contain a SHA256: fingerprint."
            }
            $expectedFingerprint = $expectedFingerprint.TrimEnd('=')
            $matchingFingerprint = $fingerprints | Where-Object { $_.TrimEnd('=') -eq $expectedFingerprint }
            if (-not $matchingFingerprint) {
              $scanned = $fingerprints -join ', '
              throw "SSH host fingerprint mismatch. Expected fingerprint: $expectedFingerprint. Scanned fingerprints: $scanned. Verify the expected value against the EC2 host through a trusted channel."
            }

            $remoteScript = @'
          set -eu
          cd /home/ubuntu/RealTimeChat
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          docker compose config -q
          docker compose build app-1 app-2
          docker compose up -d --remove-orphans
          docker compose ps
          curl --fail --retry 12 --retry-delay 5 --retry-connrefused http://127.0.0.1/ui/ >/dev/null
          echo "EC2 deployment completed successfully"
          '@

            $remoteScript | & ssh -i $keyPath -o IdentitiesOnly=yes -o "UserKnownHostsFile=$knownHostsPath" -o StrictHostKeyChecking=yes "ubuntu@$env:EC2_HOST" "bash -se"
            if ($LASTEXITCODE -ne 0) { throw "Remote EC2 deployment command failed with exit code $LASTEXITCODE." }
          }
          finally {
            Remove-Item $keyPath, $knownHostsPath, $scanPath -Force -ErrorAction SilentlyContinue
          }
