spring.application.name=RealTimeChat

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/realtime_chat?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Keep DB connection usage predictable on small EC2 instances.
# Override with DB_POOL_MAX_SIZE / DB_POOL_MIN_IDLE when load tests justify it.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:4}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

spring.jpa.hibernate.ddl-auto=update
# SQL output is useful during local debugging but adds noisy stdout I/O in production.
# Enable with JPA_SHOW_SQL=true and JPA_FORMAT_SQL=true when diagnosing SQL locally.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# Redis Pub/Sub is opt-in. Local development keeps the existing in-process broker by default.
chat.redis.enabled=${CHAT_REDIS_ENABLED:true}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Monitoring endpoints are exposed on a separate container-internal port.
management.server.port=9090
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.prometheus.metrics.export.enabled=true

# HTTP 응답 시간 히스토그램 활성화
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,250ms,500ms,1s,2s
