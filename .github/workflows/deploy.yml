name: Manual Windows Compose Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    env:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'root' }}
      GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
      DOCKER_EXE: 'C:\\Users\\jusanghyeok\\AppData\\Local\\Programs\\DockerDesktop\\resources\\bin\\docker.exe'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Java and Docker
        shell: powershell
        run: |
          java -version
          if (-not (Test-Path $env:DOCKER_EXE -PathType Leaf)) {
            throw "Docker CLI not found at configured path: $env:DOCKER_EXE"
          }
          & $env:DOCKER_EXE version
          if ($LASTEXITCODE -ne 0) {
            throw "Docker Engine is unavailable to the runner service account."
          }

      - name: Start MySQL and Redis
        shell: powershell
        run: |
          & $env:DOCKER_EXE compose up -d mysql redis
          if ($LASTEXITCODE -ne 0) { throw "docker compose up failed with exit code $LASTEXITCODE" }

      - name: Wait for MySQL and Redis health
        shell: powershell
        run: |
          $services = @("realtime-chat-mysql", "realtime-chat-redis")
          foreach ($service in $services) {
            $deadline = (Get-Date).AddMinutes(2)
            do {
              $status = & $env:DOCKER_EXE inspect --format='{{.State.Health.Status}}' $service 2>$null
              if ($LASTEXITCODE -ne 0) { throw "Container $service was not found." }
              Write-Host "$service health: $status"
              if ($status -eq "healthy") { break }
              if ($status -eq "unhealthy") {
                & $env:DOCKER_EXE logs $service
                throw "Container $service is unhealthy."
              }
              if ((Get-Date) -ge $deadline) {
                & $env:DOCKER_EXE logs $service
                throw "Timed out waiting for $service to become healthy."
              }
              Start-Sleep -Seconds 5
            } while ($true)
          }

      - name: Build application images
        shell: powershell
        run: |
          & $env:DOCKER_EXE compose build app-1 app-2
          if ($LASTEXITCODE -ne 0) { throw "docker compose build failed with exit code $LASTEXITCODE" }

      - name: Recreate application containers
        shell: powershell
        run: |
          & $env:DOCKER_EXE compose up -d --no-deps --force-recreate app-1 app-2
          if ($LASTEXITCODE -ne 0) { throw "application container restart failed with exit code $LASTEXITCODE" }

      - name: Verify container status
        shell: powershell
        run: |
          & $env:DOCKER_EXE compose ps
          if ($LASTEXITCODE -ne 0) { throw "docker compose ps failed with exit code $LASTEXITCODE" }
          $containers = @("realtime-chat-app-1", "realtime-chat-app-2")
          foreach ($container in $containers) {
            $status = & $env:DOCKER_EXE inspect --format='{{.State.Status}}' $container
            if ($LASTEXITCODE -ne 0 -or $status -ne "running") {
              & $env:DOCKER_EXE logs --tail 100 $container
              throw "Container $container is not running (status: $status)."
            }
            Write-Host "$container status: $status"
          }
