name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.EC2_DEPLOY_ENABLED == 'true' }}
    runs-on: self-hosted
    steps:
      - name: Deploy latest main on EC2
        shell: powershell
        env:
          EC2_HOST: 13.125.76.77
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_FINGERPRINT: ${{ secrets.EC2_FINGERPRINT }}
        run: |
          $ErrorActionPreference = "Stop"
          $keyPath = Join-Path $env:RUNNER_TEMP "realtimechat-ec2-deploy-key"
          $knownHostsPath = Join-Path $env:RUNNER_TEMP "realtimechat-ec2-known-hosts"
          $scanPath = Join-Path $env:RUNNER_TEMP "realtimechat-ec2-keyscan"
          $scanErrorPath = Join-Path $env:RUNNER_TEMP "realtimechat-ec2-keyscan-error"

          try {
            if ([string]::IsNullOrWhiteSpace($env:EC2_SSH_KEY)) {
              throw "EC2_SSH_KEY secret is empty."
            }
            if ([string]::IsNullOrWhiteSpace($env:EC2_FINGERPRINT)) {
              throw "EC2_FINGERPRINT secret is empty."
            }

            [System.IO.File]::WriteAllText($keyPath, $env:EC2_SSH_KEY.Trim() + "`n", [System.Text.Encoding]::ASCII)

            $tcp = Test-NetConnection -ComputerName $env:EC2_HOST -Port 22 -WarningAction SilentlyContinue
            if (-not $tcp.TcpTestSucceeded) {
              throw "TCP port 22 is unreachable at $($env:EC2_HOST). Check the Elastic IP association, security group, and SSH service."
            }

            # ssh-keyscan emits its SSH banner on stderr. Redirect stderr to prevent
            # Windows PowerShell 5.1 from treating the native stderr stream as fatal.
            $keyscanCommand = Get-Command ssh-keyscan -ErrorAction Stop
            $scanOutput = & $keyscanCommand.Source -T 10 -t ed25519,rsa $env:EC2_HOST 2>$null
            $scanExitCode = $LASTEXITCODE
            $scanOutput | Out-File -FilePath $scanPath -Encoding ascii

            if ($scanExitCode -ne 0 -or -not (Test-Path $scanPath) -or (Get-Item $scanPath).Length -eq 0) {
              throw "TCP/22 is reachable, but ssh-keyscan returned no usable host key for $($env:EC2_HOST). Exit code: $scanExitCode."
            }

            Copy-Item $scanPath $knownHostsPath -Force
            $fingerprintOutput = & ssh-keygen -lf $knownHostsPath -E sha256
            $fingerprintMatch = [regex]::Match(($fingerprintOutput -join "`n"), 'SHA256:[A-Za-z0-9+/]+')
            if (-not $fingerprintMatch.Success -or $fingerprintMatch.Value -ne $env:EC2_FINGERPRINT.Trim()) {
              throw "EC2 SSH host fingerprint mismatch. Verify EC2_FINGERPRINT against the EC2 instance host key."
            }

            $remoteScript = @'
          set -eu
          cd /home/ubuntu/RealTimeChat
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          docker compose config -q
          docker compose build app-1 app-2
          docker compose up -d --remove-orphans
          docker compose ps
          curl --fail --retry 12 --retry-delay 5 --retry-connrefused http://127.0.0.1/ui/ >/dev/null
          echo "EC2 deployment completed successfully"
          '@

            $remoteScript | & ssh -i $keyPath -o IdentitiesOnly=yes -o "UserKnownHostsFile=$knownHostsPath" -o StrictHostKeyChecking=yes "ubuntu@$env:EC2_HOST" "bash -se"
            if ($LASTEXITCODE -ne 0) {
              throw "Remote EC2 deployment command failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Remove-Item $keyPath, $knownHostsPath, $scanPath, $scanErrorPath -Force -ErrorAction SilentlyContinue
          }
