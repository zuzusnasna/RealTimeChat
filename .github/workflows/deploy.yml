name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    env:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'root' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Java and Docker
        shell: powershell
        run: |
          java -version
          $dockerExe = "C:\Users\jusanghyeok\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe"
          if (-not (Test-Path $dockerExe -PathType Leaf)) {
            throw "Docker CLI not found at configured path: $dockerExe"
          }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $dockerExe)
          & $dockerExe version
          if ($LASTEXITCODE -ne 0) {
            throw "Docker CLI was found but Docker Engine is unavailable to the runner service account."
          }

      - name: Start MySQL and Redis
        shell: powershell
        run: |
          $dockerExe = "C:\Users\jusanghyeok\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe"
          if (-not $dockerExe) { $dockerExe = (Get-Command docker.exe -ErrorAction Stop).Source }
          & $dockerExe compose up -d mysql redis
          if ($LASTEXITCODE -ne 0) { throw "docker compose up failed with exit code $LASTEXITCODE" }

      - name: Wait for MySQL and Redis health
        shell: powershell
        run: |
          $dockerExe = "C:\Users\jusanghyeok\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe"
          if (-not $dockerExe) { $dockerExe = (Get-Command docker.exe -ErrorAction Stop).Source }

          $services = @("realtime-chat-mysql", "realtime-chat-redis")
          foreach ($service in $services) {
            $deadline = (Get-Date).AddMinutes(2)
            do {
              $status = & $dockerExe inspect --format='{{.State.Health.Status}}' $service 2>$null
              if ($LASTEXITCODE -ne 0) { throw "Container $service was not found." }
              Write-Host "$service health: $status"
              if ($status -eq "healthy") { break }
              if ($status -eq "unhealthy") {
                & $dockerExe logs $service
                throw "Container $service is unhealthy."
              }
              if ((Get-Date) -ge $deadline) {
                & $dockerExe logs $service
                throw "Timed out waiting for $service to become healthy."
              }
              Start-Sleep -Seconds 5
            } while ($true)
          }

      - name: Run backend tests
        shell: powershell
        env:
          DB_URL: jdbc:mysql://localhost:3306/realtime_chat?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
          DB_USERNAME: root
          CHAT_REDIS_ENABLED: "true"
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
        run: .\gradlew.bat clean test --no-daemon

      - name: Rebuild and restart containers
        shell: powershell
        run: |
          $dockerExe = "C:\Users\jusanghyeok\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe"
          if (-not $dockerExe) { $dockerExe = (Get-Command docker.exe -ErrorAction Stop).Source }
          & $dockerExe compose up -d --build
          if ($LASTEXITCODE -ne 0) { throw "docker compose up --build failed with exit code $LASTEXITCODE" }

      - name: Show container status
        shell: powershell
        run: |
          $dockerExe = "C:\Users\jusanghyeok\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe"
          if (-not $dockerExe) { $dockerExe = (Get-Command docker.exe -ErrorAction Stop).Source }
          & $dockerExe compose ps
