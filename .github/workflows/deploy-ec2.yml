name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.EC2_DEPLOY_ENABLED == 'true' }}
    runs-on: self-hosted
    steps:
      - name: Deploy latest main on EC2
        shell: powershell
        env:
          EC2_HOST: 13.125.76.77
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_FINGERPRINT: ${{ secrets.EC2_FINGERPRINT }}
        run: |
          $ErrorActionPreference = "Stop"
          $keyPath = Join-Path $env:RUNNER_TEMP "realtimechat-ec2-deploy-key"
          $knownHostsPath = Join-Path $env:RUNNER_TEMP "realtimechat-ec2-known-hosts"
          $scanPath = Join-Path $env:RUNNER_TEMP "realtimechat-ec2-keyscan"
          $scanErrorPath = Join-Path $env:RUNNER_TEMP "realtimechat-ec2-keyscan-error"

          try {
            if ([string]::IsNullOrWhiteSpace($env:EC2_SSH_KEY)) {
              throw "EC2_SSH_KEY secret is empty."
            }
            if ([string]::IsNullOrWhiteSpace($env:EC2_FINGERPRINT)) {
              throw "EC2_FINGERPRINT secret is empty."
            }

            [System.IO.File]::WriteAllText($keyPath, $env:EC2_SSH_KEY.Trim() + "`n", [System.Text.Encoding]::ASCII)

            $tcp = Test-NetConnection -ComputerName $env:EC2_HOST -Port 22 -WarningAction SilentlyContinue
            if (-not $tcp.TcpTestSucceeded) {
              throw "TCP port 22 is unreachable at $($env:EC2_HOST). Check the Elastic IP association, security group, and SSH service."
            }

            # Run ssh-keyscan through .NET Process to avoid PowerShell 5.1's
            # native stderr-to-error-record behavior.
            # Prefer Git for Windows' bundled OpenSSH tools, which may be newer
            # than the Windows inbox OpenSSH and understand the EC2 server KEX.
            $gitKeyscan = Join-Path $env:ProgramFiles 'Git\usr\bin\ssh-keyscan.exe'
            if (Test-Path $gitKeyscan) {
              $keyscanCommand = $gitKeyscan
            } else {
              $keyscanCommand = (Get-Command ssh-keyscan -ErrorAction Stop).Source
            }
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $keyscanCommand
            $psi.Arguments = '-T 10 -t ed25519,rsa ' + $env:EC2_HOST
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $process = New-Object System.Diagnostics.Process
            $process.StartInfo = $psi
            [void]$process.Start()
            $scanOutput = $process.StandardOutput.ReadToEnd()
            $scanError = $process.StandardError.ReadToEnd()
            $process.WaitForExit()
            $scanExitCode = $process.ExitCode
            [System.IO.File]::WriteAllText($scanPath, $scanOutput, [System.Text.Encoding]::ASCII)

            if ($scanExitCode -ne 0 -or [string]::IsNullOrWhiteSpace($scanOutput)) {
              throw "TCP/22 is reachable, but ssh-keyscan returned no usable host key for $($env:EC2_HOST). Exit code: $scanExitCode. Details: $scanError"
            }

            Copy-Item $scanPath $knownHostsPath -Force
            $fingerprintOutput = & ssh-keygen -lf $knownHostsPath -E sha256
            $fingerprints = [regex]::Matches(($fingerprintOutput -join "`n"), 'SHA256:[A-Za-z0-9+/]+={0,2}') |
              ForEach-Object { $_.Value }
            $expectedFingerprint = $env:EC2_FINGERPRINT.Trim() -replace '=+

            $remoteScript = @'
          set -eu
          cd /home/ubuntu/RealTimeChat
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          docker compose config -q
          docker compose build app-1 app-2
          docker compose up -d --remove-orphans
          docker compose ps
          curl --fail --retry 12 --retry-delay 5 --retry-connrefused http://127.0.0.1/ui/ >/dev/null
          echo "EC2 deployment completed successfully"
          '@

            $remoteScript | & ssh -i $keyPath -o IdentitiesOnly=yes -o "UserKnownHostsFile=$knownHostsPath" -o StrictHostKeyChecking=yes "ubuntu@$env:EC2_HOST" "bash -se"
            if ($LASTEXITCODE -ne 0) {
              throw "Remote EC2 deployment command failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Remove-Item $keyPath, $knownHostsPath, $scanPath, $scanErrorPath -Force -ErrorAction SilentlyContinue
          }
, ''
            $matchingFingerprint = $fingerprints | Where-Object {
              ($_ -replace '=+

            $remoteScript = @'
          set -eu
          cd /home/ubuntu/RealTimeChat
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          docker compose config -q
          docker compose build app-1 app-2
          docker compose up -d --remove-orphans
          docker compose ps
          curl --fail --retry 12 --retry-delay 5 --retry-connrefused http://127.0.0.1/ui/ >/dev/null
          echo "EC2 deployment completed successfully"
          '@

            $remoteScript | & ssh -i $keyPath -o IdentitiesOnly=yes -o "UserKnownHostsFile=$knownHostsPath" -o StrictHostKeyChecking=yes "ubuntu@$env:EC2_HOST" "bash -se"
            if ($LASTEXITCODE -ne 0) {
              throw "Remote EC2 deployment command failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Remove-Item $keyPath, $knownHostsPath, $scanPath, $scanErrorPath -Force -ErrorAction SilentlyContinue
          }
, '') -eq $expectedFingerprint
            }
            if (-not $matchingFingerprint) {
              $availableTypes = ($fingerprintOutput | ForEach-Object {
                if ($_ -match '\\(([^)]+)\\) SHA256:') { $Matches[1] }
              }) -join ', '
              throw "EC2 SSH host fingerprint mismatch. Scanned host key types: $availableTypes. Confirm EC2_FINGERPRINT is the SHA256 fingerprint of this EC2 instance's SSH host key."
            }

            $remoteScript = @'
          set -eu
          cd /home/ubuntu/RealTimeChat
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          docker compose config -q
          docker compose build app-1 app-2
          docker compose up -d --remove-orphans
          docker compose ps
          curl --fail --retry 12 --retry-delay 5 --retry-connrefused http://127.0.0.1/ui/ >/dev/null
          echo "EC2 deployment completed successfully"
          '@

            $remoteScript | & ssh -i $keyPath -o IdentitiesOnly=yes -o "UserKnownHostsFile=$knownHostsPath" -o StrictHostKeyChecking=yes "ubuntu@$env:EC2_HOST" "bash -se"
            if ($LASTEXITCODE -ne 0) {
              throw "Remote EC2 deployment command failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Remove-Item $keyPath, $knownHostsPath, $scanPath, $scanErrorPath -Force -ErrorAction SilentlyContinue
          }
