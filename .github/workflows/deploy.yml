name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    env:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'root' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Java and locate Docker CLI
        shell: powershell
        run: |
          java -version

          $candidates = @(
            (Get-Command docker.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1),
            "$env:ProgramFiles\Docker\Docker\resources\bin\docker.exe",
            "$env:ProgramFiles\Docker\Docker\resources\docker.exe"
          ) | Where-Object { $_ -and (Test-Path $_ -PathType Leaf) }

          if (-not $candidates) {
            $found = Get-ChildItem "$env:ProgramFiles\Docker", "$env:ProgramData\DockerDesktop" -Filter docker.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName -First 1
            if ($found) { $candidates = @($found) }
          }

          if (-not $candidates) {
            throw "Docker CLI was not found. Check the Docker.exe path on the runner machine."
          }

          $dockerExe = $candidates[0]
          $dockerDir = Split-Path $dockerExe
          Write-Host "Docker CLI found: $dockerExe"
          Add-Content -Path $env:GITHUB_PATH -Value $dockerDir

          & $dockerExe version
          if ($LASTEXITCODE -ne 0) {
            throw "Docker CLI exists, but cannot reach the Docker engine. Ensure Docker Desktop is running and the runner service account has access."
          }

      - name: Start MySQL and Redis
        shell: powershell
        run: |
          $dockerExe = (Get-ChildItem "$env:ProgramFiles\Docker", "$env:ProgramData\DockerDesktop" -Filter docker.exe -Recurse -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName -First 1)
          if (-not $dockerExe) { $dockerExe = (Get-Command docker.exe -ErrorAction Stop).Source }
          & $dockerExe compose up -d mysql redis
          if ($LASTEXITCODE -ne 0) { throw "docker compose up failed with exit code $LASTEXITCODE" }

      - name: Wait for MySQL and Redis health
        shell: powershell
        run: |
          $dockerExe = (Get-ChildItem "$env:ProgramFiles\Docker", "$env:ProgramData\DockerDesktop" -Filter docker.exe -Recurse -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName -First 1)
          if (-not $dockerExe) { $dockerExe = (Get-Command docker.exe -ErrorAction Stop).Source }

          $services = @("realtime-chat-mysql", "realtime-chat-redis")
          foreach ($service in $services) {
            $deadline = (Get-Date).AddMinutes(2)
            do {
              $status = & $dockerExe inspect --format='{{.State.Health.Status}}' $service 2>$null
              if ($LASTEXITCODE -ne 0) { throw "Container $service was not found." }
              Write-Host "$service health: $status"
              if ($status -eq "healthy") { break }
              if ($status -eq "unhealthy") {
                & $dockerExe logs $service
                throw "Container $service is unhealthy."
              }
              if ((Get-Date) -ge $deadline) {
                & $dockerExe logs $service
                throw "Timed out waiting for $service to become healthy."
              }
              Start-Sleep -Seconds 5
            } while ($true)
          }

      - name: Run backend tests
        shell: powershell
        env:
          DB_URL: jdbc:mysql://localhost:3306/realtime_chat?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
          DB_USERNAME: root
          CHAT_REDIS_ENABLED: "true"
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
        run: .\gradlew.bat clean test --no-daemon

      - name: Rebuild and restart containers
        shell: powershell
        run: |
          $dockerExe = (Get-ChildItem "$env:ProgramFiles\Docker", "$env:ProgramData\DockerDesktop" -Filter docker.exe -Recurse -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName -First 1)
          if (-not $dockerExe) { $dockerExe = (Get-Command docker.exe -ErrorAction Stop).Source }
          & $dockerExe compose up -d --build
          if ($LASTEXITCODE -ne 0) { throw "docker compose up --build failed with exit code $LASTEXITCODE" }

      - name: Show container status
        shell: powershell
        run: |
          $dockerExe = (Get-ChildItem "$env:ProgramFiles\Docker", "$env:ProgramData\DockerDesktop" -Filter docker.exe -Recurse -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName -First 1)
          if (-not $dockerExe) { $dockerExe = (Get-Command docker.exe -ErrorAction Stop).Source }
          & $dockerExe compose ps
