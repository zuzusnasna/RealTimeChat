<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171b26" />
    <title>RealTimeChat</title>
    <style>
      @media (max-width: 720px) {
        .composer input {
          font-size: 16px !important;
        }
      }

      /* Room owner actions: keep delete reachable without making the list noisy. */
      .room-item .room-delete {
        width: 34px;
        flex-basis: 34px;
        min-height: 36px;
        margin: 2px 0;
        border-left: 1px solid transparent;
        color: #aeb6c5;
        font-size: 18px;
        font-weight: 500;
        opacity: .9;
      }
      .room-item .room-delete:hover,
      .room-item .room-delete:focus-visible {
        border-left-color: #454b58;
        background: #2b303c;
        color: #ff8f9b;
        opacity: 1;
      }
      .room-item:hover .room-delete {
        color: #c5ccda;
      }
      @media (max-width: 720px) {
        .room-item .room-delete {
          width: 40px;
          flex-basis: 40px;
          min-height: 40px;
          color: #b9c1cf;
        }
      }

      /* The room-home card is a separate view from the sidebar room list. */
      .room-card {
        position: relative;
      }
      .room-card-delete {
        position: absolute;
        right: 56px;
        bottom: 12px;
        z-index: 3;
        width: 34px;
        height: 34px;
        padding: 0;
        border: 1px solid #e1e4e9;
        border-radius: 50%;
        background: #fff;
        color: #8b929e;
        box-shadow: 0 2px 8px rgba(32, 38, 53, .08);
        font-size: 18px;
        font-weight: 500;
        line-height: 1;
        cursor: pointer;
        transition: border-color .15s ease, color .15s ease, box-shadow .15s ease, transform .15s ease;
      }
      .room-card-delete:hover,
      .room-card-delete:focus-visible {
        border-color: #ffb8bf;
        color: #e34f5f;
        box-shadow: 0 3px 10px rgba(32, 38, 53, .12);
        transform: translateY(-1px);
      }
      @media (max-width: 720px) {
        .room-card-delete {
          right: 58px;
          bottom: 10px;
          width: 40px;
          height: 40px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (() => {
        let rooms = [];
        let busy = false;

        async function loadRoomOwners() {
          try {
            const response = await fetch('/api/rooms', { credentials: 'same-origin' });
            if (!response.ok) return;
            rooms = await response.json();
            decorateRoomCards();
          } catch {}
        }

        function decorateRoomCards() {
          const cards = document.querySelectorAll('.room-card-list .room-card');
          cards.forEach((card, index) => {
            const room = rooms[index];
            if (!room?.owner || card.querySelector('.room-card-delete')) return;

            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'room-card-delete';
            button.setAttribute('aria-label', room.name + ' 채팅방 삭제');
            button.title = '채팅방 삭제';
            button.textContent = '×';
            button.addEventListener('click', async event => {
              event.preventDefault();
              event.stopPropagation();
              if (busy) return;
              if (!window.confirm(`'${room.name}' 채팅방을 삭제할까요? 저장된 메시지와 참여 정보도 모두 삭제됩니다.`)) return;

              busy = true;
              try {
                const response = await fetch('/api/rooms/' + room.id, {
                  method: 'DELETE',
                  credentials: 'same-origin'
                });
                if (!response.ok) throw new Error('채팅방을 삭제하지 못했습니다.');
                sessionStorage.removeItem('lastActiveRoomId');
                window.location.reload();
              } catch (error) {
                window.alert(error.message || '채팅방을 삭제하지 못했습니다.');
              } finally {
                busy = false;
              }
            });
            card.appendChild(button);
          });
        }

        window.addEventListener('DOMContentLoaded', () => {
          loadRoomOwners();
          const observer = new MutationObserver(decorateRoomCards);
          observer.observe(document.getElementById('root'), { childList: true, subtree: true });
        });
      })();
    </script>
  </body>
</html>
