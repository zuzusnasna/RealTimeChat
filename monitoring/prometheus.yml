global:
  scrape_interval: 15s

scrape_configs:
  - job_name: app-1
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - app-1:9090
        labels:
          instance_name: app-1
  - job_name: app-2
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - app-2:9090
        labels:
          instance_name: app-2
