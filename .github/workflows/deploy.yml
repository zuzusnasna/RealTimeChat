name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Java
        run: java -version

      - name: Run backend tests
        shell: powershell
        run: .\gradlew.bat test --no-daemon

      - name: Rebuild and restart containers
        shell: powershell
        run: docker compose up -d --build

      - name: Show container status
        shell: powershell
        run: docker compose ps
