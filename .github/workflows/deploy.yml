name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    env:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'root' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Java and configure Docker PATH
        shell: powershell
        run: |
          java -version

          $dockerCommand = Get-Command docker -ErrorAction SilentlyContinue
          if ($dockerCommand) {
            $dockerDir = Split-Path $dockerCommand.Source
          } else {
            $candidates = @(
              "$env:ProgramFiles\Docker\Docker\resources\bin\docker.exe",
              "$env:ProgramFiles\Docker\Docker\resources",
              "$env:ProgramData\DockerDesktop\version-bin\docker.exe"
            )
            $dockerExe = $candidates | Where-Object { Test-Path $_ -PathType Leaf } | Select-Object -First 1
            if (-not $dockerExe) {
              throw "Docker CLI was not found. Install Docker Desktop or add the folder containing docker.exe to the system PATH, then restart the GitHub Actions Runner service."
            }
            $dockerDir = Split-Path $dockerExe
          }

          Write-Host "Using Docker CLI from: $dockerDir"
          Add-Content -Path $env:GITHUB_PATH -Value $dockerDir

          $dockerExePath = Join-Path $dockerDir "docker.exe"
          & $dockerExePath version
          if ($LASTEXITCODE -ne 0) {
            throw "Docker CLI was found, but it could not communicate with the Docker engine. Ensure Docker Desktop/Engine is running and accessible to the runner service."
          }

      - name: Start MySQL and Redis
        shell: powershell
        run: docker compose up -d mysql redis

      - name: Wait for MySQL and Redis health
        shell: powershell
        run: |
          $services = @("realtime-chat-mysql", "realtime-chat-redis")
          foreach ($service in $services) {
            $deadline = (Get-Date).AddMinutes(2)
            do {
              $status = docker inspect --format='{{.State.Health.Status}}' $service 2>$null
              if ($LASTEXITCODE -ne 0) {
                throw "Container $service was not found."
              }
              Write-Host "$service health: $status"
              if ($status -eq "healthy") { break }
              if ($status -eq "unhealthy") {
                docker logs $service
                throw "Container $service is unhealthy."
              }
              if ((Get-Date) -ge $deadline) {
                docker logs $service
                throw "Timed out waiting for $service to become healthy."
              }
              Start-Sleep -Seconds 5
            } while ($true)
          }

      - name: Run backend tests
        shell: powershell
        env:
          DB_URL: jdbc:mysql://localhost:3306/realtime_chat?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
          DB_USERNAME: root
          CHAT_REDIS_ENABLED: "true"
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
        run: .\gradlew.bat clean test --no-daemon

      - name: Rebuild and restart containers
        shell: powershell
        run: docker compose up -d --build

      - name: Show container status
        shell: powershell
        run: docker compose ps
