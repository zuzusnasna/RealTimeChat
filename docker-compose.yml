# Production/EC2 stack. Local development uses docker-compose.local.yml.
services:
  nginx:
    image: nginx:1.28-alpine
    container_name: realtime-chat-nginx
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-1
      - app-2
    restart: unless-stopped
    mem_limit: 24m

  mysql:
    image: mysql:8.4
    container_name: realtime-chat-mysql
    environment:
      MYSQL_DATABASE: realtime_chat
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    command:
      - --innodb-buffer-pool-size=48M
      - --performance-schema=OFF
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    mem_limit: 224m

  redis:
    image: redis:7-alpine
    container_name: realtime-chat-redis
    command: ["redis-server", "--save", "60", "1000", "--appendonly", "yes", "--maxmemory", "32mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 48m

  app-1:
    build: .
    container_name: realtime-chat-app-1
    environment:
      DB_URL: jdbc:mysql://mysql:3306/realtime_chat?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      CHAT_REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      SERVER_PORT: 8080
      MANAGEMENT_SERVER_PORT: 9090
      JAVA_TOOL_OPTIONS: "-Xms32m -Xmx112m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=16m -Xss384k -XX:+UseSerialGC"
    expose:
      - "8080"
      - "9090"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 288m

  app-2:
    build: .
    container_name: realtime-chat-app-2
    environment:
      DB_URL: jdbc:mysql://mysql:3306/realtime_chat?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      CHAT_REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      SERVER_PORT: 8080
      MANAGEMENT_SERVER_PORT: 9090
      JAVA_TOOL_OPTIONS: "-Xms32m -Xmx112m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=16m -Xss384k -XX:+UseSerialGC"
    expose:
      - "8080"
      - "9090"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 288m

  # Enable only when investigating performance; these consume additional EC2 memory.
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.5.0
    container_name: realtime-chat-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - app-1
      - app-2
    restart: unless-stopped
    mem_limit: 96m

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:12.1.1
    container_name: realtime-chat-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    mem_limit: 96m

volumes:
  mysql-data:
  redis-data:
  prometheus-data:
  grafana-data:
