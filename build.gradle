plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.realtimechat'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    runtimeOnly 'com.mysql:mysql-connector-j'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-websocket-test'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def frontendDir = file("$projectDir/frontend")
def frontendNodeModules = file("$frontendDir/node_modules")
def frontendBuildDir = file("$projectDir/src/main/resources/static/ui")

tasks.register('installFrontendDependencies', Exec) {
    group = 'frontend'
    description = 'Install frontend dependencies from the lockfile.'

    workingDir frontendDir
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', 'npm ci'
    } else {
        commandLine 'npm', 'ci'
    }

    inputs.files(file("$frontendDir/package.json"), file("$frontendDir/package-lock.json"))
    outputs.dir(frontendNodeModules)
}

tasks.register('buildFrontend', Exec) {
    group = 'frontend'
    description = 'Build the React frontend into Spring Boot static resources.'

    dependsOn 'installFrontendDependencies'
    workingDir frontendDir
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', 'npm run build'
    } else {
        commandLine 'npm', 'run', 'build'
    }

    inputs.files(
        fileTree("$frontendDir/src"),
        file("$frontendDir/index.html"),
        file("$frontendDir/vite.config.js"),
        file("$frontendDir/package.json"),
        file("$frontendDir/package-lock.json")
    )
    outputs.dir(frontendBuildDir)
}

tasks.named('processResources') {
    dependsOn 'buildFrontend'
}

tasks.named('test') {
    useJUnitPlatform()
}
